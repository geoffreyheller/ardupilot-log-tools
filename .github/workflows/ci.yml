name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      # Every tests/test_*.py, found by glob, each in its own process. The reference-log
      # regressions in test_toolkit.py skip when LOG_DIR is unset; the committed fixture
      # (tests/fixtures/largeprop-quad.bin) and the synthetic logs run everywhere.
      - run: python tests/run_all.py
      - run: python alog.py --help
