name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      # Synthetic-log tests: the parser's fail-loud behaviour on every malformed input
      # the writer can produce. The reference-log regressions skip when LOG_DIR is unset.
      - run: python tests/test_toolkit.py
      - run: python tests/test_parser_integrity.py
      - run: python tests/test_cli.py
      - run: python alog.py --help
